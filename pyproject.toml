[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hctz-model"
version = "0.10.0"
description = "This repository provides the hydrochlorothiazide (hctz) physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Schwaiger, Amanda" },
    { name = "König, Matthias" },
]
keywords = [
    "model",
    "hctz",
    "hydrochlorothiazide",
    "pharmacokinetics",
    "pharmacodynamics",
    "PBPK/PD",
    "physiologically based pharmacokinetic/ pharmacodynamic model",
    "SBML",
]
dependencies = [
    "pymetadata>=0.8.0",
    "sbmlutils[cytoscape]>=0.16.0",
    "sbmlode>=0.3.0",
    "sbmlsim>=0.13.0",
    "pkpdutils>=1.3.0",
    "pkpdsim>=0.11.0",
    "libroadrunner>=2.11.0",
    "python-libsbml>=5.21.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
    "pint>=0.26.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "petab>=0.9.0",
    "scikit-learn>=1.9.1",
    "typst>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/hctz-model"
Repository = "https://github.com/matthiaskoenig/hctz-model"
Documentation = "https://matthiaskoenig.github.io/hctz-model/"
Issues = "https://github.com/matthiaskoenig/hctz-model/issues"

[dependency-groups]
docs = ["zensical"]

[tool.hatch.build.targets.wheel]
packages = ["src/pkdb_models"]

[tool.uv]
constraint-dependencies = [
