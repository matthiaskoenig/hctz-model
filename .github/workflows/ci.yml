name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true

      - name: Put libpython on the library search path
        # the extension of libroadrunner links against libpython. The standalone
        # interpreters uv installs ship it in their `lib`, where the loader does
        # not look; without it the import of roadrunner fails with
        # `libpython3.14.so.1.0: cannot open shared object file`
        run: |
          prefix=$(uv run --no-project python -c "import sys; print(sys.base_prefix)")
          echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: Create the models
        run: uv run run_simulation pkdb_models.models.hctz --action factory

      - name: List the experiments
        run: uv run run_simulation pkdb_models.models.hctz --action list_experiments

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: cicd:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
