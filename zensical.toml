[project]
site_name = "Physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model of hydrochlorothiazide"
site_url = "https://matthiaskoenig.github.io/hctz-model/"
site_description = "This repository provides the hydrochlorothiazide (hctz) physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model."
site_author = "Amanda Schwaiger and Matthias König"

copyright = "Copyright &copy; 2024-2026 Amanda Schwaiger and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/hctz-model"
repo_name = "matthiaskoenig/hctz-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/hctz-model"
